name: Build and Push Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      enable_push:
        description: 'Enable push to Docker Hub'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker Image for Verification
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        load: true
        tags: piclist:verify
        platforms: linux/amd64

    - name: Verify Installed Package Version
      run: |
        expected_version="$(node -p "require('./package.json').version")"
        installed_version="$(docker run --rm piclist:verify node -p "require('/usr/local/lib/node_modules/piclist/package.json').version")"
        test "$installed_version" = "$expected_version"
        test "$(docker run --rm piclist:verify picgo --version)" = "$expected_version"
        docker run --rm piclist:verify node /usr/local/bin/picgo-server --help

    - name: Login to Docker Hub
      if: github.event.inputs.enable_push == 'true' || startsWith(github.ref, 'refs/tags/')
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event.inputs.enable_push == 'true' || startsWith(github.ref, 'refs/tags/') }}
        tags: kuingsmile/piclist:latest
        platforms: linux/amd64,linux/arm64

    - name: Build and Push Docker Image with Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: kuingsmile/piclist:${{ github.ref_name }}
        platforms: linux/amd64,linux/arm64
