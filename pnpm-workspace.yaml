patchedDependencies:
  # Allow the upload server to supply a decoder for ordinary multipart parameters.
  busboy@1.6.0: patches/busboy@1.6.0.patch

overrides:
  # WebDAV imports fetch and its standard constructors. Use Node 24's native implementations.
  'webdav>node-fetch': npm:node-fetch-native@^1.6.7
  '@buttercup/fetch>node-fetch': npm:node-fetch-native@^1.6.7
  # The fixed glob and minimatch releases retain the APIs used by dpdm and WebDAV.
  'dpdm>glob': ^14.0.6
  'webdav>minimatch': ^11.0.9

allowBuilds:
  sharp: true
  ssh2-no-cpu-features: true

# Exact releases resolved before pnpm's default 24-hour release-age window elapsed.
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1172.0'
  - '@aws-sdk/lib-storage@3.1172.0'
  - '@aws-sdk/middleware-sdk-s3@3.972.90'
  - '@aws-sdk/s3-request-presigner@3.1172.0'
  - '@rolldown/binding-android-arm-eabi@1.3.3'
  - '@rolldown/binding-android-arm64@1.3.3'
  - '@rolldown/binding-darwin-arm64@1.3.3'
  - '@rolldown/binding-darwin-x64@1.3.3'
  - '@rolldown/binding-freebsd-x64@1.3.3'
  - '@rolldown/binding-linux-arm-gnueabihf@1.3.3'
  - '@rolldown/binding-linux-arm64-gnu@1.3.3'
  - '@rolldown/binding-linux-arm64-musl@1.3.3'
  - '@rolldown/binding-linux-ppc64-gnu@1.3.3'
  - '@rolldown/binding-linux-s390x-gnu@1.3.3'
  - '@rolldown/binding-linux-x64-gnu@1.3.3'
  - '@rolldown/binding-linux-x64-musl@1.3.3'
  - '@rolldown/binding-openharmony-arm64@1.3.3'
  - '@rolldown/binding-wasm32-wasi@1.3.3'
  - '@rolldown/binding-win32-arm64-msvc@1.3.3'
  - '@rolldown/binding-win32-x64-msvc@1.3.3'
  - node-bump-version@3.1.0
  - rolldown@1.3.3
